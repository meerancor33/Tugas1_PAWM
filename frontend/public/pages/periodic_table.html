<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel Periodik - Virtual Learning</title>
    <link rel="stylesheet" href="../styles/periodic-table.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <h1 class="nav-logo">Virtual Learning</h1>
            <ul class="nav-menu">
                <li><a href="welcome.html" class="nav-link">Beranda</a></li>
                <li><a href="periodic_table.html" class="nav-link active">Tabel Periodik</a></li>
                <li><a href="flashcard.html" class="nav-link">Flashcard</a></li>
                <li><a href="quiz.html" class="nav-link">Kuis</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <h1 class="page-title">Tabel Periodik Interaktif</h1>
            <p class="page-subtitle">Klik pada unsur untuk melihat informasi detail</p>
            
            <div class="periodic-table">
                <div class="element" data-element="H" data-name="Hidrogen" data-number="1" data-mass="1.008">H</div>
                <div class="element noble-gas" data-element="He" data-name="Helium" data-number="2" data-mass="4.003">He</div>
                
                <div class="element alkali" data-element="Li" data-name="Litium" data-number="3" data-mass="6.941">Li</div>
                <div class="element alkaline" data-element="Be" data-name="Berilium" data-number="4" data-mass="9.012">Be</div>
                <div class="element metalloid" data-element="B" data-name="Boron" data-number="5" data-mass="10.811">B</div>
                <div class="element nonmetal" data-element="C" data-name="Karbon" data-number="6" data-mass="12.011">C</div>
                <div class="element nonmetal" data-element="N" data-name="Nitrogen" data-number="7" data-mass="14.007">N</div>
                <div class="element nonmetal" data-element="O" data-name="Oksigen" data-number="8" data-mass="15.999">O</div>
                <div class="element halogen" data-element="F" data-name="Fluorin" data-number="9" data-mass="18.998">F</div>
                <div class="element noble-gas" data-element="Ne" data-name="Neon" data-number="10" data-mass="20.180">Ne</div>
                
                <div class="element alkali" data-element="Na" data-name="Natrium" data-number="11" data-mass="22.990">Na</div>
                <div class="element alkaline" data-element="Mg" data-name="Magnesium" data-number="12" data-mass="24.305">Mg</div>
                <div class="element metal" data-element="Al" data-name="Aluminium" data-number="13" data-mass="26.982">Al</div>
                <div class="element metalloid" data-element="Si" data-name="Silikon" data-number="14" data-mass="28.086">Si</div>
                <div class="element nonmetal" data-element="P" data-name="Fosfor" data-number="15" data-mass="30.974">P</div>
                <div class="element nonmetal" data-element="S" data-name="Sulfur" data-number="16" data-mass="32.065">S</div>
                <div class="element halogen" data-element="Cl" data-name="Klorin" data-number="17" data-mass="35.453">Cl</div>
                <div class="element noble-gas" data-element="Ar" data-name="Argon" data-number="18" data-mass="39.948">Ar</div>
            </div>

            <div id="element-info" class="element-info hidden">
                <h3 id="element-title"></h3>
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">Simbol:</span>
                        <span id="element-symbol"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Nomor Atom:</span>
                        <span id="element-number"></span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Massa Atom:</span>
                        <span id="element-mass"></span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../scripts/periodic-script.js"></script>
</body>
</html>
