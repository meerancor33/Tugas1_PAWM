openapi: 3.1.0
info:
  title: Virtual Lab Backend
  version: 1.0.0
paths:
  /:
    get:
      summary: Root
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health:
    get:
      summary: Health Check
      description: Health check endpoint
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /auth/register:
    post:
      summary: Register
      operationId: register_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterReq'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/login:
    post:
      summary: Login
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginReq'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResp'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /profile:
    get:
      summary: Profile
      operationId: profile_profile_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /progress/flashcard:
    post:
      summary: Flashcard Progress
      description: 'Save flashcard progress for a specific module.

        Updates existing record for the module or creates a new one.'
      operationId: flashcard_progress_progress_flashcard_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlashcardReq'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /progress/quiz:
    post:
      summary: Quiz Result
      operationId: quiz_result_progress_quiz_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizReq'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /progress/game:
    post:
      summary: Game Stat
      operationId: game_stat_progress_game_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameReq'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /progress/learning:
    post:
      summary: Learning Action
      operationId: learning_action_progress_learning_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningReq'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
components:
  schemas:
    FlashcardReq:
      properties:
        module:
          type: string
          title: Module
        current:
          type: integer
          title: Current
        total:
          type: integer
          title: Total
      type: object
      required:
      - module
      - current
      - total
      title: FlashcardReq
    GameReq:
      properties:
        game:
          type: string
          title: Game
        metric:
          type: string
          title: Metric
        value:
          type: integer
          title: Value
      type: object
      required:
      - game
      - metric
      - value
      title: GameReq
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LearningReq:
      properties:
        module:
          type: string
          title: Module
        action:
          type: string
          title: Action
      type: object
      required:
      - module
      - action
      title: LearningReq
    LoginReq:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          title: Password
      type: object
      required:
      - email
      - password
      title: LoginReq
    QuizReq:
      properties:
        module:
          type: string
          title: Module
        score:
          type: integer
          title: Score
        total:
          type: integer
          title: Total
      type: object
      required:
      - module
      - score
      - total
      title: QuizReq
    RegisterReq:
      properties:
        email:
          type: string
          format: email
          title: Email
        password:
          type: string
          title: Password
      type: object
      required:
      - email
      - password
      title: RegisterReq
    TokenResp:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        user:
          type: object
          title: User
      type: object
      required:
      - access_token
      - user
      title: TokenResp
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
